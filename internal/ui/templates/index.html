<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABAP Code-Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Yanone+Kaffeesatz:wght@400;600&family=Roboto+Condensed:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
  <style>
    :root {
      --green-dark:   #4fbd57;
      --green-bright: #8de040;
      --green-brand:  #7aab8a;
      --pink-accent:  #e94c74;
      --off-white:    #e7e6e5;
      --soft-black:   #25141d;
      --gray:         #c4cac1;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto Condensed', sans-serif;
      background: var(--off-white);
      color: var(--soft-black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem;
    }
    h1 {
      font-family: 'Yanone Kaffeesatz', sans-serif;
      font-size: 2.4rem;
      color: var(--green-brand);
      margin-bottom: 2rem;
      letter-spacing: 0.03em;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      max-width: 420px;
    }
    label { font-weight: 500; }
    input[type="text"], input:not([type]) {
      padding: 0.6rem 0.8rem;
      border: 2px solid var(--gray);
      border-radius: 4px;
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.15s;
    }
    input:focus {
      outline: none;
      border-color: var(--green-dark);
      box-shadow: 0 0 0 3px rgba(79,189,87,0.15);
    }
    select {
      padding: 0.6rem 0.8rem;
      border: 2px solid var(--gray);
      border-radius: 4px;
      font-family: inherit;
      font-size: 1rem;
      background: #fff;
      cursor: pointer;
    }
    select:focus {
      outline: none;
      border-color: var(--green-dark);
      box-shadow: 0 0 0 3px rgba(79,189,87,0.15);
    }
    textarea {
      padding: 0.6rem 0.8rem;
      border: 2px solid var(--gray);
      border-radius: 4px;
      font-family: inherit;
      font-size: 1rem;
      resize: vertical;
      transition: border-color 0.15s;
    }
    textarea:focus {
      outline: none;
      border-color: var(--green-dark);
      box-shadow: 0 0 0 3px rgba(79,189,87,0.15);
    }
    button[type="submit"] {
      padding: 0.65rem 1.4rem;
      background: var(--green-dark);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: 'Yanone Kaffeesatz', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.15s;
    }
    button[type="submit"]:hover { background: var(--green-brand); }
    button[type="submit"]:active { background: #3a9940; }
    #result { margin-top: 1.5rem; width: 100%; max-width: 420px; }
    #result a { color: var(--green-brand); font-weight: 500; }
    .review-ready {
      padding: 1.2rem 1.4rem;
      background: #f0faf1;
      border: 2px solid var(--green-dark);
      border-radius: 6px;
      text-align: center;
    }
    .review-ready__msg { margin-bottom: .75rem; font-size: 1rem; }
    .review-ready__btn {
      display: inline-block;
      padding: .65rem 1.6rem;
      background: #2a6e2e;
      color: #fff;
      border-radius: 4px;
      text-decoration: none;
      font-family: 'Yanone Kaffeesatz', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: .04em;
      transition: background .15s;
    }
    .review-ready__btn:hover { background: #1e5022; }
    .error {
      padding: 1rem;
      background: #fde8ed;
      border-left: 4px solid var(--pink-accent);
      border-radius: 4px;
      color: #8b1a35;
      font-size: .95rem;
    }
  </style>
</head>
<body>
  <h1>ABAP Code-Review</h1>
  <form hx-post="/api/reviews"
        hx-target="#result"
        hx-swap="innerHTML"
        hx-sync="this:drop">
    <label for="tr">Transportauftragsnummer</label>
    <div style="position:relative">
      <input id="tr" name="transport_request_id"
             placeholder="NPLK900014" required
             autocomplete="off">
      <ul id="tr-suggestions" style="
        display:none; position:absolute; left:0; right:0; top:100%;
        background:#fff; border:1px solid var(--gray); border-radius:4px;
        max-height:220px; overflow-y:auto; margin:0; padding:0;
        list-style:none; z-index:10; box-shadow:0 4px 8px rgba(0,0,0,.1);
      "></ul>
    </div>
    <label style="display:flex;align-items:center;gap:.5rem;font-weight:400;font-size:.9rem;color:#555;cursor:pointer">
      <input type="checkbox" id="show-released" style="cursor:pointer">
      Auch freigegebene Transportaufträge anzeigen
    </label>
    <label for="prompt">Rezensions-Stil</label>
    <select id="prompt" name="prompt">
      <option value="review_pedantic" selected>Pedantische Code-Review für erfahrene Entwickler*innen</option>
      <option value="review_appreciative">Wertschätzende Code-Review mit praktischen Tipps für Newbies</option>
      <option value="review_analytical">Technisch-Analytische Code-Review (Selbst-Konsistenz des TA)</option>
      <option value="review_guidelines_hf">Prüfung gegen HF-Entwicklungsrichtlinien</option>
      <option value="review_clean_abap">Prüfung gegen SAP Clean ABAP</option>
    </select>
    <label for="model">Modell</label>
    <select id="model" name="model">
      <option value="claude-opus-4-8">Opus 4.8 (beste Qualität, &gt;1€/Review)</option>
      <option value="claude-sonnet-4-6" selected>Sonnet 4.6 (~20 Ct/Review, schneller)</option>
      <option value="claude-haiku-4-5-20251001">Haiku 4.5 (~10 Ct/Review, am schnellsten)</option>
    </select>
    <label for="comment">Kommentar an den Agenten</label>
    <textarea id="comment" name="user_comment" rows="3" maxlength="2000"
              placeholder="Optional, z. B. Hinweise, Fokuspunkte oder Akzeptanzkriterien für dieses Review"></textarea>
    <button type="submit">Review anfordern</button>
  </form>
  <div id="result"></div>
  <script>
    // CSRF: the approuter checks an X-CSRF-Token header on every non-GET
    // request under /api/*. The token lives in the approuter session; a GET
    // with "X-CSRF-Token: Fetch" returns it in the x-csrf-token response
    // header. /api/me is a cheap, JWT-gated GET, so no extra route is
    // needed. See docs/superpowers/specs/2026-06-02-ai-abap-review-service-design.md §6.
    let csrfToken = null;
    function fetchCsrfToken() {
      return fetch('/api/me', { headers: { 'X-CSRF-Token': 'Fetch' }, credentials: 'same-origin' })
        .then(r => { csrfToken = r.headers.get('x-csrf-token'); })
        .catch(() => {});
    }
    fetchCsrfToken();

    document.body.addEventListener('htmx:configRequest', evt => {
      if (csrfToken) evt.detail.headers['X-CSRF-Token'] = csrfToken;
    });

    // A 403 with "x-csrf-token: Required" means the request carried no token
    // (submitted before the fetch above finished) or one that no longer
    // matches the approuter session. Fetch a fresh token and re-issue the
    // request once. An expired session is answered with 401 instead, which a
    // new token cannot fix, so both end states ask the user to reload.
    //
    // A submit -> 403 -> token refresh -> retry cycle spans two async gaps
    // (the failed request's own round trip, then fetchCsrfToken() itself)
    // during which the SAME element can be submitted again. htmx's own
    // per-element request lock (eltData.xhr) does not cover the FIRST gap:
    // it is released the moment the failed response arrives (htmx clears it
    // right after htmx:afterRequest, before this handler even runs), well
    // before fetchCsrfToken() resolves and the retry is issued. Without an
    // explicit guard, a second submit during that gap starts its own
    // independent cycle on the same element, and the two interleave -- e.g.
    // the tr_title/tr_author listener below needs to know whether it's
    // looking at a retry, and a second submit's own failure could clear that
    // signal out from under the first cycle's still-pending retry, making it
    // run unmarked with metadata recomputed from whatever the user has typed
    // since.
    //
    // pendingCycles tracks, per element, whether a cycle is currently
    // running (true) or has progressed to "the retry itself is in flight"
    // ('retry') -- so exactly one retry is ever in flight per element, the
    // htmx:confirm listener below can drop any other submit of that element
    // for the duration, and no other listener needs its own per-element flag.
    const pendingCycles = new WeakMap(); // elt -> true | 'retry'

    // Block a fresh submit of an element while a CSRF retry cycle for it is
    // still running (the gap above); let the cycle's own retry (tagged
    // 'retry' just before it is issued, below) through. The SECOND gap --
    // the retry's own XHR round trip -- is covered instead by the form's
    // hx-sync="this:drop" attribute: once the retry is issued, htmx's
    // per-element lock (eltData.xhr) IS held again for its duration, so any
    // submit htmx:confirm lets through here (state is 'retry', not true)
    // is still dropped by htmx's own sync handling before a request is
    // built, rather than queued and re-sent afterwards (htmx 2.0.4's
    // default `queue last` on a busy element). The retry call itself is
    // issued only after the failed request has fully completed -- htmx has
    // already cleared eltData.xhr for this element by then -- so `drop`
    // never blocks the retry, only a later, unrelated submit.
    document.body.addEventListener('htmx:confirm', evt => {
      if (evt.detail.path !== '/api/reviews') return;
      if (pendingCycles.get(evt.detail.elt) === true) evt.preventDefault();
    });

    document.body.addEventListener('htmx:responseError', evt => {
      const xhr = evt.detail.xhr;
      const elt = evt.detail.elt;
      const csrfRejected = xhr.status === 403 && xhr.getResponseHeader('x-csrf-token') === 'Required';
      const isRetryResponse = pendingCycles.get(elt) === 'retry';
      if (csrfRejected && !isRetryResponse) {
        pendingCycles.set(elt, true);
        // Snapshot the values htmx actually submitted (form fields plus
        // anything injected by other configRequest listeners, e.g. tr_title/
        // tr_author below) so the retry replays the ORIGINAL request rather
        // than re-serializing the form. Without this, edits made to the form
        // while the token fetch is in flight would silently change what gets
        // submitted on retry.
        const originalValues = Object.fromEntries(evt.detail.requestConfig.parameters);
        fetchCsrfToken().then(() => {
          pendingCycles.set(elt, 'retry');
          // A network error/abort/timeout on the retry rejects this promise
          // (htmx's xhr.onerror/onabort/ontimeout) without ever emitting
          // htmx:responseError -- that event only fires from within the
          // xhr.onload path, which a network failure never reaches. Without
          // this .catch(), pendingCycles would stay stuck at 'retry' forever:
          // the htmx:confirm guard above only blocks the true state, so this
          // wouldn't block further submits, but it would permanently defeat
          // the tr_title/tr_author "is this a retry" check below for this
          // element. A network failure isn't a session problem (no token was
          // rejected), so it gets its own generic hint rather than the
          // "session expired" message above.
          htmx.ajax(evt.detail.requestConfig.verb, evt.detail.requestConfig.path, {
            source: elt,
            values: originalValues
          }).catch(() => {
            pendingCycles.delete(elt);
            document.getElementById('result').innerHTML =
              '<div class="error">Der erneute Versuch ist fehlgeschlagen. Bitte das Review erneut anfordern.</div>';
          });
        });
        return;
      }
      pendingCycles.delete(elt);
      if (csrfRejected || xhr.status === 401) {
        document.getElementById('result').innerHTML =
          '<div class="error">Die Sitzung ist abgelaufen. Bitte die Seite neu laden und das Review erneut anfordern.</div>';
      }
    });
    document.body.addEventListener('htmx:afterRequest', evt => {
      if (evt.detail.successful) pendingCycles.delete(evt.detail.elt);
    });

    // Load TRs in the background; filter client-side as the user types.
    // The checkbox triggers a re-fetch with ?released=true to include released TRs.
    let allTRs = [];

    const input = document.getElementById('tr');
    const list  = document.getElementById('tr-suggestions');

    function loadTRs() {
      const released = document.getElementById('show-released').checked;
      const url = '/api/transport-requests' + (released ? '?released=true' : '');
      fetch(url).then(r => r.json()).then(data => { allTRs = data; showSuggestions(input.value); }).catch(() => {});
    }
    loadTRs();

    function showSuggestions(q) {
      if (!q || !allTRs.length) { list.style.display = 'none'; return; }
      const ql = q.toLowerCase();
      const hits = allTRs.filter(tr =>
        tr.number.toLowerCase().includes(ql) ||
        tr.owner.toLowerCase().includes(ql) ||
        tr.description.toLowerCase().includes(ql)
      ).slice(0, 20);
      if (!hits.length) { list.style.display = 'none'; return; }
      list.innerHTML = '';
      hits.forEach(tr => {
        const li = document.createElement('li');
        li.style.cssText = 'padding:.5rem .75rem;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:.95rem';
        li.onmouseenter = () => li.style.background = 'var(--off-white)';
        li.onmouseleave = () => li.style.background = '';
        const num  = document.createElement('strong');
        const rest = document.createElement('span');
        num.textContent  = tr.number;
        rest.textContent = ' — ' + tr.description + ' (' + tr.owner + ')';
        rest.style.color = '#666';
        li.appendChild(num);
        li.appendChild(rest);
        li.addEventListener('click', () => {
          input.value = tr.number;
          list.style.display = 'none';
        });
        list.appendChild(li);
      });
      list.style.display = 'block';
    }

    // Attach the selected TR's title + owner to the review request. The full TR
    // list is already loaded client-side, so this works whether the user clicked
    // a suggestion or typed the number by hand. If the typed number isn't in the
    // loaded list (e.g. a released TR with the checkbox off), the fields stay
    // empty and the server renders the header without them.
    //
    // On a CSRF retry (pendingCycles has this element tagged 'retry'), the
    // responseError handler above has already put the original
    // tr_title/tr_author into the request via the `values` override, so this
    // must not recompute them from the form's current state -- that could
    // replace the originally submitted values with whatever the user has
    // typed since.
    document.body.addEventListener('htmx:configRequest', function(evt) {
      if (evt.detail.path !== '/api/reviews') return;
      if (pendingCycles.get(evt.detail.elt) === 'retry') return;
      const q = (input.value || '').trim().toUpperCase();
      const tr = allTRs.find(t => t.number.toUpperCase() === q);
      evt.detail.parameters['tr_title']  = tr ? tr.description : '';
      evt.detail.parameters['tr_author'] = tr ? tr.owner : '';
    });

    input.addEventListener('input',  () => showSuggestions(input.value));
    input.addEventListener('focus',  () => showSuggestions(input.value));
    document.getElementById('show-released').addEventListener('change', loadTRs);
    document.addEventListener('click', e => {
      if (!list.contains(e.target) && e.target !== input) list.style.display = 'none';
    });
  </script>
</body>
</html>
